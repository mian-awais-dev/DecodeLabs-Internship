<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" role="img" aria-label="AI Automation and Workflow Platform preview">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F6" />
      <stop offset="100%" stop-color="#E8F4F7" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="8" fill="url(#p3Grad)" stroke="#E0DDD8" stroke-width="1.5" />
  <!-- Node Pipeline Canvas -->
  <!-- Connecting lines -->
  <path d="M 90 80 C 130 80, 140 125, 180 125" fill="none" stroke="#A0D4E0" stroke-width="3" stroke-dasharray="4 2" />
  <path d="M 90 170 C 130 170, 140 125, 180 125" fill="none" stroke="#A6856F" stroke-width="3" />
  <path d="M 240 125 C 280 125, 290 80, 320 80" fill="none" stroke="#A6856F" stroke-width="3" />
  <path d="M 240 125 C 280 125, 290 170, 320 170" fill="none" stroke="#A0D4E0" stroke-width="3" />

  <!-- Node 1: Input -->
  <rect x="30" y="55" width="75" height="50" rx="8" fill="#FFFFFF" stroke="#E0DDD8" stroke-width="1.5" />
  <circle cx="48" cy="72" r="5" fill="#A0D4E0" />
  <rect x="42" y="85" width="45" height="5" rx="2" fill="#2C2C2C" />

  <!-- Node 2: Data Stream -->
  <rect x="30" y="145" width="75" height="50" rx="8" fill="#FFFFFF" stroke="#E0DDD8" stroke-width="1.5" />
  <circle cx="48" cy="162" r="5" fill="#A6856F" />
  <rect x="42" y="175" width="45" height="5" rx="2" fill="#2C2C2C" />

  <!-- Node 3: AI Neural Core (Center) -->
  <rect x="160" y="95" width="90" height="60" rx="10" fill="#FFFFFF" stroke="#A6856F" stroke-width="2" />
  <circle cx="205" cy="115" r="10" fill="#A6856F" />
  <text x="205" y="140" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#2C2C2C" text-anchor="middle">Neural Core</text>

  <!-- Node 4: Cloud Output -->
  <rect x="305" y="55" width="75" height="50" rx="8" fill="#FFFFFF" stroke="#E0DDD8" stroke-width="1.5" />
  <circle cx="323" cy="72" r="5" fill="#A6856F" />
  <rect x="318" y="85" width="45" height="5" rx="2" fill="#2C2C2C" />

  <!-- Node 5: Analytics Output -->
  <rect x="305" y="145" width="75" height="50" rx="8" fill="#FFFFFF" stroke="#E0DDD8" stroke-width="1.5" />
  <circle cx="323" cy="162" r="5" fill="#A0D4E0" />
  <rect x="318" y="175" width="45" height="5" rx="2" fill="#2C2C2C" />

  <!-- Status pill bottom -->
  <rect x="140" y="210" width="120" height="22" rx="11" fill="#FFFFFF" stroke="#A0D4E0" />
  <circle cx="152" cy="221" r="3.5" fill="#4B9B82" />
  <text x="164" y="225" font-family="'Roboto', sans-serif" font-size="9" fill="#2C2C2C" font-weight="500">Pipeline Active</text>
</svg>
