<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" role="img" aria-label="DecodeLabs engineering and design architecture team">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F0EA" />
      <stop offset="100%" stop-color="#E8E4DA" />
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2C2C2C" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Background decorative canvas -->
  <rect x="20" y="20" width="460" height="320" rx="16" fill="url(#aboutGrad)" stroke="#E0DDD8" stroke-width="1.5" />
  <circle cx="100" cy="80" r="40" fill="#A0D4E0" opacity="0.4" />
  <circle cx="420" cy="280" r="50" fill="#A6856F" opacity="0.2" />

  <!-- Central Workstation / Code Screen Card -->
  <g filter="url(#aboutShadow)">
    <rect x="70" y="60" width="360" height="230" rx="12" fill="#FFFFFF" stroke="#E0DDD8" stroke-width="1.5" />
    
    <!-- Code Editor Header -->
    <rect x="70" y="60" width="360" height="34" rx="12" fill="#2C2C2C" />
    <circle cx="90" cy="77" r="4.5" fill="#E88B8B" />
    <circle cx="104" cy="77" r="4.5" fill="#E5C158" />
    <circle cx="118" cy="77" r="4.5" fill="#75C99E" />
    <text x="145" y="81" font-family="'Roboto', monospace" font-size="10" fill="#A0D4E0">architecture.config.js</text>

    <!-- Code Syntax Mockup Lines -->
    <rect x="90" y="110" width="110" height="8" rx="3" fill="#A6856F" />
    <rect x="210" y="110" width="60" height="8" rx="3" fill="#A0D4E0" />
    
    <rect x="110" y="130" width="70" height="8" rx="3" fill="#2C2C2C" />
    <rect x="190" y="130" width="120" height="8" rx="3" fill="#8E6C57" />
    
    <rect x="110" y="150" width="140" height="8" rx="3" fill="#A0D4E0" />
    <rect x="260" y="150" width="50" height="8" rx="3" fill="#2C2C2C" />
    
    <rect x="90" y="170" width="90" height="8" rx="3" fill="#A6856F" />
    
    <!-- Stats Row in Card -->
    <rect x="90" y="200" width="150" height="60" rx="8" fill="#F9F8F6" stroke="#E0DDD8" />
    <text x="105" y="225" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#A6856F">100%</text>
    <text x="105" y="245" font-family="'Roboto', sans-serif" font-size="9" fill="#78736E">Vanilla Standards</text>

    <rect x="260" y="200" width="150" height="60" rx="8" fill="#F9F8F6" stroke="#E0DDD8" />
    <text x="275" y="225" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#2C2C2C">WCAG AA</text>
    <text x="275" y="245" font-family="'Roboto', sans-serif" font-size="9" fill="#78736E">Accessible by Design</text>
  </g>
</svg>
