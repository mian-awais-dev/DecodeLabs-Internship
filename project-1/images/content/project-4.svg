<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%" role="img" aria-label="Modern Design System UI Kit preview">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F6" />
      <stop offset="100%" stop-color="#F2F0EA" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="8" fill="url(#p4Grad)" stroke="#E0DDD8" stroke-width="1.5" />
  
  <!-- Color Swatches Row -->
  <rect x="25" y="25" width="45" height="40" rx="6" fill="#A6856F" />
  <rect x="78" y="25" width="45" height="40" rx="6" fill="#A0D4E0" />
  <rect x="131" y="25" width="45" height="40" rx="6" fill="#F2F0EA" stroke="#E0DDD8" />
  <rect x="184" y="25" width="45" height="40" rx="6" fill="#2C2C2C" />
  <text x="245" y="48" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#2C2C2C">Tokens &amp; Variables</text>
  <text x="245" y="60" font-family="'Roboto', sans-serif" font-size="9" fill="#78736E">Accessible Color Harmonies</text>

  <!-- Component Showcase Box -->
  <rect x="25" y="80" width="350" height="145" rx="8" fill="#FFFFFF" stroke="#E0DDD8" />
  
  <!-- Buttons demo -->
  <rect x="40" y="98" width="95" height="30" rx="6" fill="#A6856F" />
  <text x="87" y="117" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Primary Btn</text>

  <rect x="145" y="98" width="95" height="30" rx="6" fill="none" stroke="#A6856F" stroke-width="1.5" />
  <text x="192" y="117" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#A6856F" text-anchor="middle">Secondary</text>

  <rect x="250" y="98" width="95" height="30" rx="6" fill="#A0D4E0" />
  <text x="297" y="117" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#2C2C2C" text-anchor="middle">Action Btn</text>

  <!-- Input Field demo -->
  <rect x="40" y="145" width="200" height="32" rx="6" fill="#F9F8F6" stroke="#E0DDD8" />
  <text x="52" y="165" font-family="'Roboto', sans-serif" font-size="10" fill="#78736E">Active Input Field...</text>

  <rect x="250" y="145" width="115" height="32" rx="6" fill="#F2F0EA" stroke="#A6856F" stroke-width="1" />
  <text x="307" y="165" font-family="'Montserrat', sans-serif" font-weight="600" font-size="9" fill="#A6856F" text-anchor="middle">Select Dropdown</text>

  <!-- Badge row -->
  <rect x="40" y="190" width="60" height="20" rx="10" fill="#F2F0EA" />
  <text x="70" y="203" font-family="'Roboto', sans-serif" font-size="8" font-weight="500" fill="#2C2C2C" text-anchor="middle">Tag 01</text>

  <rect x="108" y="190" width="60" height="20" rx="10" fill="#A0D4E0" opacity="0.4" />
  <text x="138" y="203" font-family="'Roboto', sans-serif" font-size="8" font-weight="500" fill="#2C2C2C" text-anchor="middle">Tag 02</text>

  <rect x="176" y="190" width="60" height="20" rx="10" fill="#A6856F" opacity="0.2" />
  <text x="206" y="203" font-family="'Roboto', sans-serif" font-size="8" font-weight="500" fill="#8E6C57" text-anchor="middle">Tag 03</text>
</svg>
